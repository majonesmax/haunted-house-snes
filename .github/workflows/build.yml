# On every push to main and every pull request: the code rules, then the shareable ROM built with PVSnesLib,
# booted in the emulator and checked against the remaster's model frame by frame (a shorter run than the full
# one, which takes a while), with its sound effects, hints and light. On a version tag
# (git tag v1.0.0 && git push origin v1.0.0) it also makes that release: the ROM, SHA256SUMS.txt and the
# notes in docs/release-notes/<tag>.md, then puts the "play in your browser" page up (pages.yml).
#
# The tools are fetched at their pinned versions (tools/get_tools.py); nothing of them is committed. None of
# it needs the 2600 game: the shareable build is the NES game's mansion. The faithful build needs your own
# ROM, so it's only ever built on your computer.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: haunted-house-snes
      - name: The remaster, beside it (the spec, the models, the SNES look and its packs)
        uses: actions/checkout@v4
        with:
          repository: majonesmax/haunted-house-remastered
          path: haunted-house
      - name: The NES game, beside it (the mansion)
        uses: actions/checkout@v4
        with:
          repository: majonesmax/haunted-house-nes
          path: haunted-house-nes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: PortAudio, which the remaster's check imports
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: The Python tools
        working-directory: haunted-house-snes
        run: python -m pip install -r requirements-dev.txt
      - name: Readability rules (ruff)
        working-directory: haunted-house-snes
        run: ruff check --config ruff.toml .
      - name: No file got harder to read (tools/readability.py)
        working-directory: haunted-house-snes
        run: python tools/readability.py
      - name: PVSnesLib, the audio driver and the emulator core
        working-directory: haunted-house-snes
        run: python tools/get_tools.py
      - name: The audio driver's compiler
        working-directory: haunted-house-snes
        run: cargo build --release -p tad-compiler --manifest-path tools/tad/Cargo.toml
      - name: The compiler's weak spots are the known ones
        working-directory: haunted-house-snes
        run: python tests/test_compiler.py
      - name: Build the shareable ROM
        working-directory: haunted-house-snes
        run: python tools/build.py
      - name: It boots
        working-directory: haunted-house-snes
        run: python tests/test_boot.py
      - name: It plays exactly as the model says, frame by frame
        working-directory: haunted-house-snes
        run: python tests/verify_engine.py --shareable 1500
      - name: The sound effects fire on the right events
        working-directory: haunted-house-snes
        run: python tests/test_events.py 300
      - name: The hints say what the remaster's rules say
        working-directory: haunted-house-snes
        run: python tests/test_hints.py 300
      - name: A match lit again on the spot gives light
        working-directory: haunted-house-snes
        run: python tests/test_light.py
      - name: The ROM, as this run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: haunted_house.sfc
          path: haunted-house-snes/build/shareable/haunted_house.sfc
      - name: The release (on a version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: haunted-house-snes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/shareable/haunted_house.sfc haunted_house.sfc
          sha256sum haunted_house.sfc > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" haunted_house.sfc SHA256SUMS.txt \
            --title "Haunted House: By Matchlight (SNES) $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"

  site:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
